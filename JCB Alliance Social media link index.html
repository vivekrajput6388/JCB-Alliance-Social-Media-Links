<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCB Alliance – Social Media Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow:  #F5C518;
      --black:   #0D0D0D;
      --dark:    #1A1A1A;
      --card:    #222222;
      --text:    #EEEEEE;
      --muted:   #888888;
    }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* --- Animated background stripes --- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 60px,
        rgba(245,197,24,0.03) 60px,
        rgba(245,197,24,0.03) 61px
      );
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* --- Logo / Avatar area --- */
    .avatar-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--yellow), #c9a000);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 0 0 4px var(--black), 0 0 0 7px var(--yellow);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px var(--black), 0 0 0 7px var(--yellow); }
      50%       { box-shadow: 0 0 0 4px var(--black), 0 0 0 12px rgba(245,197,24,0.4); }
    }
    .avatar-ring svg { width: 44px; height: 44px; }

    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      letter-spacing: 0.08em;
      color: var(--yellow);
      line-height: 1;
      text-align: center;
    }
    .brand-tagline {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 6px;
      margin-bottom: 36px;
      text-align: center;
    }

    /* --- Divider --- */
    .divider {
      width: 40px;
      height: 3px;
      background: var(--yellow);
      border-radius: 2px;
      margin-bottom: 32px;
    }

    /* --- Social Cards --- */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid #2e2e2e;
      border-radius: 14px;
      padding: 16px 20px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
    }
    .link-card:hover {
      transform: translateY(-3px);
      border-color: var(--yellow);
      box-shadow: 0 8px 28px rgba(245,197,24,0.15);
    }
    .link-card:active { transform: translateY(0px); }

    .icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-wrap svg { width: 24px; height: 24px; }

    .ig   { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .fb   { background: #1877F2; }
    .yt   { background: #FF0000; }
    .wa   { background: #25D366; }

    .link-info {
      flex: 1;
    }
    .link-platform {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .link-label {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--text);
    }

    .arrow {
      color: var(--muted);
      transition: color 0.18s, transform 0.18s;
    }
    .link-card:hover .arrow {
      color: var(--yellow);
      transform: translateX(3px);
    }

    /* --- Footer --- */
    .footer {
      margin-top: 40px;
      font-size: 0.72rem;
      color: #444;
      letter-spacing: 0.08em;
      text-align: center;
    }
    .footer span { color: var(--yellow); }
  </style>
</head>
